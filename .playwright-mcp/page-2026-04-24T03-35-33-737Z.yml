                  - heading "Pocket TTS" [level=1] [ref=e484]
                  - 'link "Permalink: Pocket TTS" [ref=e485] [cursor=pointer]':
                    - /url: "#pocket-tts"
                    - img [ref=e486]
                - link "pocket-tts-logo-v2-transparent" [ref=e488] [cursor=pointer]:
                  - /url: https://private-user-images.githubusercontent.com/8401624/536331102-637b5ed6-831f-4023-9b4c-741be21ab238.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..f-xDcQR-RUooA5tpi6rBD2WOWzPX5Scdfgej7ZWNNIM
                  - img "pocket-tts-logo-v2-transparent" [ref=e489]
                - paragraph [ref=e490]: A lightweight text-to-speech (TTS) application designed to run efficiently on CPUs. Forget about the hassle of using GPUs and web APIs serving TTS models. With Kyutai's Pocket TTS, generating audio is just a pip install and a function call away.
                - paragraph [ref=e491]: Supports Python 3.10, 3.11, 3.12, 3.13 and 3.14. Requires PyTorch 2.5+. Does not require the gpu version of PyTorch.
                - paragraph [ref=e492]:
                  - link "🔊 Demo" [ref=e493] [cursor=pointer]:
                    - /url: https://kyutai.org/pocket-tts
                  - text: "|"
                  - link "🐱‍💻GitHub Repository" [ref=e494] [cursor=pointer]:
                    - /url: https://github.com/kyutai-labs/pocket-tts
                  - text: "|"
                  - link "🤗 Hugging Face Model Card" [ref=e495] [cursor=pointer]:
                    - /url: https://huggingface.co/kyutai/pocket-tts
                  - text: "|"
                  - link "⚙️ Tech report" [ref=e496] [cursor=pointer]:
                    - /url: https://kyutai.org/blog/2026-01-13-pocket-tts
                  - text: "|"
                  - link "📄 Paper" [ref=e497] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/2509.06926
                  - text: "|"
                  - link "📚 Documentation" [ref=e498] [cursor=pointer]:
                    - /url: https://kyutai-labs.github.io/pocket-tts/
                - generic [ref=e499]:
                  - heading "Main takeaways" [level=2] [ref=e500]
                  - 'link "Permalink: Main takeaways" [ref=e501] [cursor=pointer]':
                    - /url: "#main-takeaways"
                    - img [ref=e502]
                - list [ref=e504]:
                  - listitem [ref=e505]: Runs on CPU
                  - listitem [ref=e506]: Small model size, 100M parameters
                  - listitem [ref=e507]: Audio streaming
                  - listitem [ref=e508]: Low latency, ~200ms to get the first audio chunk
                  - listitem [ref=e509]: Faster than real-time, ~6x real-time on a CPU of MacBook Air M4
                  - listitem [ref=e510]: Uses only 2 CPU cores
                  - listitem [ref=e511]: Python API and CLI
                  - listitem [ref=e512]: Voice cloning
                  - listitem [ref=e513]: "Multi-language support: english, french, german, portuguese, italian, spanish"
                  - listitem [ref=e514]: Can handle infinitely long text inputs
                  - listitem [ref=e515]:
                    - link "Can run on client-side in the browser" [ref=e516] [cursor=pointer]:
                      - /url: "#in-browser-implementations"
                - paragraph [ref=e517]: Additional languages may be added in the future.
                - generic [ref=e518]:
