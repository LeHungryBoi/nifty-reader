                    - /url: https://kyutai.org/pocket-tts
                  - text: to try it out directly in your browser. You can input text, select different voices, and generate speech without any installation.
                - generic [ref=e525]:
                  - heading "Trying it with the CLI" [level=2] [ref=e526]
