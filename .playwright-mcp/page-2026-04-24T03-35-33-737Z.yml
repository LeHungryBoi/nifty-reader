                - paragraph [ref=e655]: You can use this package as a simple Python library to generate audio from text.
                - generic [ref=e656]:
                  - generic [ref=e657]: "from pocket_tts import TTSModel import scipy.io.wavfile tts_model = TTSModel.load_model() voice_state = tts_model.get_state_for_audio_prompt( \"alba\" # One of the pre-made voices, see above # You can also use any voice file you have locally or from Hugging Face: # \"./some_audio.wav\" # or \"hf://kyutai/tts-voices/expresso/ex01-ex02_default_001_channel2_198s.wav\" ) audio = tts_model.generate_audio(voice_state, \"Hello world, this is a test.\") # Audio is a 1D torch tensor containing PCM data. scipy.io.wavfile.write(\"output.wav\", tts_model.sample_rate, audio.numpy())"
                  - button "Copy" [ref=e659] [cursor=pointer]:
                    - img [ref=e660]
                - paragraph [ref=e663]:
                  - text: You can have multiple voice states around if you have multiple voices you want to use.
                  - code [ref=e664]: load_model()
                  - text: and
                  - code [ref=e665]: get_state_for_audio_prompt()
                  - text: are relatively slow operations, so we recommend to keep the model and voice states in memory if you can.
                - paragraph [ref=e666]: "For faster voice loading, you can export voice states to safetensors files:"
                - generic [ref=e667]:
                  - generic [ref=e668]: "from pocket_tts import TTSModel, export_model_state model = TTSModel.load_model() # Export a voice state for fast loading later model_state = model.get_state_for_audio_prompt(\"some_voice.wav\") export_model_state(model_state, \"./some_voice.safetensors\") # Later, load it quickly, this is quite fast as it's just reading the kvcache # from disk and doesn't do any others computations. model_state_copy = model.get_state_for_audio_prompt(\"./some_voice.safetensors\") audio = model.generate_audio(model_state_copy, \"Hello world!\")"
