                - paragraph [ref=e1600]:
                  - text: This repository supports running the following functions
                  - strong [ref=e1601]: locally
                - list [ref=e1602]:
                  - listitem [ref=e1603]: Speech-to-text (i.e., ASR); both streaming and non-streaming are supported
                  - listitem [ref=e1604]: Text-to-speech (i.e., TTS)
                  - listitem [ref=e1605]: Speaker diarization
                  - listitem [ref=e1606]: Speaker identification
                  - listitem [ref=e1607]: Speaker verification
                  - listitem [ref=e1608]: Spoken language identification
                  - listitem [ref=e1609]: Audio tagging
                  - listitem [ref=e1610]:
                    - text: VAD (e.g.,
                    - link "silero-vad" [ref=e1611] [cursor=pointer]:
                      - /url: https://github.com/snakers4/silero-vad
                    - text: )
                  - listitem [ref=e1612]:
                    - text: Speech enhancement (e.g.,
                    - link "gtcrn" [ref=e1613] [cursor=pointer]:
                      - /url: https://github.com/Xiaobin-Rong/gtcrn
                    - text: ","
                    - link "DPDFNet" [ref=e1614] [cursor=pointer]:
                      - /url: https://github.com/ceva-ip/DPDFNet
                    - text: )
                  - listitem [ref=e1615]: Keyword spotting
                  - listitem [ref=e1616]:
                    - text: Source separation (e.g.,
                    - link "spleeter" [ref=e1617] [cursor=pointer]:
                      - /url: https://github.com/deezer/spleeter
                    - text: ","
                    - link "UVR" [ref=e1618] [cursor=pointer]:
                      - /url: https://github.com/Anjok07/ultimatevocalremovergui
                    - text: )
